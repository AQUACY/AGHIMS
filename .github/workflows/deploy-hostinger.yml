# Deploy license-portal-v2 to Hostinger Business (Node.js web app).
#
# First time in hPanel:
#   1. Websites → Add Website → Node.js web app
#   2. Create the site for your domain (Git import or a one-time zip is fine)
#   3. Framework: Express (or Other). Entry file: app.js. Node 22. No build step.
#   4. Put production env vars in the Node.js app Environment variables
#      (never commit .env or license_private.pem)
#   5. hPanel → API → generate a token
#
# GitHub → Settings → Secrets and variables → Actions, add:
#   HOSTINGER_API_TOKEN   — API token from hPanel
#   HOSTINGER_USERNAME    — hosting account user, e.g. u123456789 (FTP username without the domain)
#   HOSTINGER_DOMAIN      — the site domain, e.g. licenses.example.com
#
# After that, every push to main that touches the portal (or a manual Run workflow)
# uploads a zip and starts a Hostinger Node.js build, which installs npm and restarts the app.
#
# Alternative with no YAML: in the Node.js app, Connect with GitHub, repo AGHIMS,
# root directory license-portal-v2, entry file app.js. Hostinger then deploys on every push.

name: Deploy license portal to Hostinger

on:
  push:
    branches: [main, license-portal-hosting]
    paths:
      - "license-portal-v2/**"
      - ".github/workflows/deploy-hostinger.yml"
  workflow_dispatch:

concurrency:
  group: hostinger-license-portal
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: license-portal-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: license-portal-v2/package-lock.json
      - run: npm ci
      - run: npm run test:sign
      - run: npm run test:smoke

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      API: https://developers.hostinger.com
      TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
      DOMAIN: ${{ secrets.HOSTINGER_DOMAIN }}
      ARCHIVE: license-portal-deploy.zip
    steps:
      - uses: actions/checkout@v4

      - name: Check Hostinger secrets
        run: |
          if [ -z "$TOKEN" ] || [ -z "$USERNAME" ] || [ -z "$DOMAIN" ]; then
            echo "Add GitHub Actions secrets HOSTINGER_API_TOKEN, HOSTINGER_USERNAME, and HOSTINGER_DOMAIN."
            exit 1
          fi

      - name: Pack license-portal-v2
        run: |
          set -euo pipefail
          cd license-portal-v2
          zip -r "../$ARCHIVE" . \
            -x "node_modules/*" \
            -x "node_modules/**" \
            -x "data/*" \
            -x "data/**" \
            -x ".env" \
            -x ".env.*" \
            -x "*.pem" \
            -x "*.db" \
            -x ".git/*" \
            -x ".git/**"
          ls -lh "../$ARCHIVE"

      - name: Upload archive and start Hostinger build
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys, urllib.parse

          api = os.environ["API"]
          token = os.environ["TOKEN"]
          username = os.environ["USERNAME"]
          domain = os.environ["DOMAIN"]
          archive = os.environ["ARCHIVE"]

          def curl(args, check=True):
              cmd = ["curl", "-sS", *args]
              out = subprocess.check_output(cmd, stderr=subprocess.STDOUT)
              return out

          def api_json(method, path, data=None):
              args = [
                  "-X", method,
                  f"{api}{path}",
                  "-H", f"Authorization: Bearer {token}",
                  "-H", "Content-Type: application/json",
              ]
              if data is not None:
                  args.extend(["-d", json.dumps(data)])
              raw = curl(args)
              try:
                  return json.loads(raw.decode())
              except json.JSONDecodeError:
                  sys.stderr.write(raw.decode(errors="replace") + "\n")
                  raise SystemExit("Hostinger API did not return JSON")

          def pick(d, *keys):
              if not isinstance(d, dict):
                  return None
              for k in keys:
                  if d.get(k):
                      return d[k]
              inner = d.get("data") if isinstance(d.get("data"), dict) else {}
              for k in keys:
                  if inner.get(k):
                      return inner[k]
              return None

          upload = api_json("POST", "/api/hosting/v1/files/upload-urls", {
              "username": username,
              "domain": domain,
          })
          url = pick(upload, "url")
          auth = pick(upload, "auth_key", "authKey")
          rest = pick(upload, "rest_auth_key", "restAuthKey")
          if not url or not auth:
              print(json.dumps(upload, indent=2))
              raise SystemExit("Could not get an upload URL. Check HOSTINGER_API_TOKEN, USERNAME, and DOMAIN.")

          size = os.path.getsize(archive)
          dest = f"{url.rstrip('/')}/{archive}?override=true"
          print(f"Uploading {archive} ({size} bytes)")
          curl([
              "-f", "-X", "POST", dest,
              "-H", f"X-Auth: {auth}",
              "-H", f"X-Auth-Rest: {rest}",
              "-H", "Tus-Resumable: 1.0.0",
              "-H", f"Upload-Length: {size}",
              "-H", "Upload-Offset: 0",
              "-o", "/dev/null",
          ])
          curl([
              "-f", "-X", "PATCH", dest,
              "-H", f"X-Auth: {auth}",
              "-H", f"X-Auth-Rest: {rest}",
              "-H", "Tus-Resumable: 1.0.0",
              "-H", "Content-Type: application/offset+octet-stream",
              "-H", "Upload-Offset: 0",
              "--data-binary", f"@{archive}",
              "-o", "/dev/null",
          ])

          enc_user = urllib.parse.quote(username, safe="")
          enc_domain = urllib.parse.quote(domain, safe="")
          build = api_json(
              "POST",
              f"/api/hosting/v1/accounts/{enc_user}/websites/{enc_domain}/nodejs/builds",
              {
                  "node_version": 22,
                  "app_type": "express",
                  "root_directory": "/",
                  "output_directory": "",
                  "build_script": "",
                  "entry_file": "app.js",
                  "package_manager": "npm",
                  "source_type": "archive",
                  "source_options": {"archive_path": archive},
              },
          )
          print(json.dumps(build, indent=2))
          uuid = pick(build, "uuid")
          if not uuid:
              raise SystemExit("Hostinger did not return a build uuid.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"BUILD_UUID={uuid}\n")
          print(f"Started build {uuid}")
          PY

      - name: Wait for Hostinger build
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess, sys, time, urllib.parse

          api = os.environ["API"]
          token = os.environ["TOKEN"]
          username = os.environ["USERNAME"]
          domain = os.environ["DOMAIN"]
          uuid = os.environ["BUILD_UUID"]
          enc_user = urllib.parse.quote(username, safe="")
          enc_domain = urllib.parse.quote(domain, safe="")

          def get(path):
              raw = subprocess.check_output([
                  "curl", "-sS", f"{api}{path}",
                  "-H", f"Authorization: Bearer {token}",
              ])
              try:
                  return json.loads(raw.decode())
              except json.JSONDecodeError:
                  return {"_raw": raw.decode(errors="replace")}

          def rows(payload):
              if isinstance(payload, list):
                  return payload
              if not isinstance(payload, dict):
                  return []
              for key in ("data", "items", "builds"):
                  val = payload.get(key)
                  if isinstance(val, list):
                      return val
              return []

          from_line = 0
          for _ in range(90):
              logs = get(
                  f"/api/hosting/v1/accounts/{enc_user}/websites/{enc_domain}/nodejs/builds/{uuid}/logs?from_line={from_line}"
              )
              text = ""
              if isinstance(logs, dict):
                  text = logs.get("content") or logs.get("logs") or logs.get("output") or ""
                  if isinstance(text, list):
                      text = "\n".join(str(x) for x in text)
                  if isinstance(logs.get("lines"), int):
                      from_line = logs["lines"]
              if text:
                  print(text, flush=True)

              listing = get(
                  f"/api/hosting/v1/accounts/{enc_user}/websites/{enc_domain}/nodejs/builds?per_page=25"
              )
              hit = next((b for b in rows(listing) if isinstance(b, dict) and b.get("uuid") == uuid), None)
              state = (hit or {}).get("state") or ""
              print(f"Build state: {state or 'unknown'}", flush=True)
              if state in ("completed", "success", "succeeded"):
                  sys.exit(0)
              if state in ("failed", "error", "cancelled"):
                  sys.exit("Hostinger build failed.")
              time.sleep(10)
          sys.exit("Timed out waiting for Hostinger build.")
          PY
